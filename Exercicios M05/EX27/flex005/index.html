<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: #a66666;
        }
        main{
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #30197c;
            justify-content: center;
            align-items: center;
        }
        section{
            width: 250px;
            height: 250px;
            background-color: #5179c3;
        }
    </style>
</head>
<body>
    <main class="container">
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
